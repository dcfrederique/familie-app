<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mijn figuurtje</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Mockup "Mijn figuurtje": kleerkast links het figuurtje, rechts categorieën en keuzes. Tablet liggend 1194 × 834. */
:root {
  color-scheme: light;
  --bg: #E8EEF6; --surface: #FFFFFF; --ink: #1C2433; --muted: #4E5A6B; --line: #D5DCE4; --soft: #EEF3F8;
  --gold: #F2B33D; --gold-edge: #B8800F; --gold-bg: #FFF4D6; --gold-ink: #6B4A00;
  --ok: #1F7A4A; --ok-bg: #DDF2E6; --ok-ink: #155C37;
  --on-solid: #FFFFFF; --shade: #C9D3DE; --banner: #16264A; --banner-ink: #FFFFFF;
  --luca: #2D6BD6; --luca-tint: #E3EDFC; --yuna: #C2541A; --yuna-tint: #FCE9DD; --feline: #1F7A4A; --feline-tint: #DDF2E6;
  --kid: #2D6BD6; --kid-tint: #E3EDFC;
  --proto: #6A5BD1; --proto-bg: #F0EEFC;
  --font-display: 'Baloo 2', Nunito, system-ui, sans-serif;
  --font-body: Nunito, system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121A2A; --surface: #1C2638; --ink: #EEF2F8; --muted: #A9B4C4; --line: #34425A; --soft: #243149;
    --gold-bg: #3A2F12; --gold-ink: #F7D58A; --ok: #5CC48A; --ok-bg: #163826; --ok-ink: #9BE3B9;
    --on-solid: #10182A; --shade: #0C1220; --banner: #0E1830; --banner-ink: #EEF2F8;
    --luca: #7FA6F0; --luca-tint: #22345A; --yuna: #F29A63; --yuna-tint: #43281A; --feline: #66CC93; --feline-tint: #183A28;
    --proto: #A99CF2; --proto-bg: #26223F;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121A2A; --surface: #1C2638; --ink: #EEF2F8; --muted: #A9B4C4; --line: #34425A; --soft: #243149;
  --gold-bg: #3A2F12; --gold-ink: #F7D58A; --ok: #5CC48A; --ok-bg: #163826; --ok-ink: #9BE3B9;
  --on-solid: #10182A; --shade: #0C1220; --banner: #0E1830; --banner-ink: #EEF2F8;
  --luca: #7FA6F0; --luca-tint: #22345A; --yuna: #F29A63; --yuna-tint: #43281A; --feline: #66CC93; --feline-tint: #183A28;
  --proto: #A99CF2; --proto-bg: #26223F;
}
html { height: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
body.kid-luca { --kid: var(--luca); --kid-tint: var(--luca-tint); }
body.kid-yuna { --kid: var(--yuna); --kid-tint: var(--yuna-tint); }
body.kid-feline { --kid: var(--feline); --kid-tint: var(--feline-tint); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--kid); outline-offset: 3px; }
.display { font-family: var(--font-display); font-weight: 800; }
.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }

/* Prototype-balk: hoort niet bij de app */
.proto { border-bottom: 2px dashed var(--proto); background: var(--proto-bg); color: var(--proto); }
.proto .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 10px; font-size: 14px; font-weight: 800; }
.proto .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.proto .lbl { text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }
.proto button { height: 34px; padding: 0 12px; border: 2px solid var(--proto); border-radius: 17px; background: transparent; color: var(--proto); font-weight: 800; font-size: 14px; }
.proto button[aria-pressed="true"] { background: var(--proto); color: var(--proto-bg); }
.proto button:focus-visible { outline-color: var(--proto); }

/* Bovenbalk van de kindschermen */
.bar { display: flex; align-items: center; gap: 14px; padding-block: 20px 8px; }
.round { width: 64px; height: 64px; border: 0; border-radius: 50%; background: var(--surface); display: grid; place-items: center; flex-shrink: 0; }
.bar h1 { margin: 0; font-size: clamp(26px, 3.4vw, 36px); line-height: 1.1; flex-grow: 1; text-wrap: balance; }
.goal { display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 20px 0 14px; border-radius: 32px; background: var(--surface); min-width: 0; }
.goal b { font-family: var(--font-display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.goal .txt { display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 700; color: var(--muted); min-width: 0; }
.meter { width: 150px; max-width: 100%; height: 10px; border-radius: 5px; background: var(--gold-bg); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--gold); border-radius: 5px; }
.starrow { display: flex; gap: 6px; }
.starrow svg { width: 34px; height: 34px; }

/* Kleerkast */
.kast { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; padding-block: 8px 28px; }
.stage { position: relative; border-radius: 40px; background: var(--surface); display: flex; align-items: flex-end; justify-content: center; min-height: 520px; overflow: hidden; }
.stage::before { content: ""; position: absolute; left: 12%; right: 12%; bottom: 34px; height: 52px; border-radius: 50%; background: var(--kid-tint); }
.stage .fig { position: relative; width: min(100%, 320px); height: auto; margin-bottom: 40px; }
.fig.hop { animation: hop .35s ease; }
@keyframes hop { 40% { transform: translateY(-18px) scaleY(1.03); } 100% { transform: none; } }
.tip { position: absolute; left: 20px; right: 20px; top: 20px; padding: 16px 20px; border-radius: 24px; background: var(--gold-bg); color: var(--gold-ink); font-size: 20px; font-weight: 800; line-height: 1.25; display: flex; gap: 12px; align-items: center; }
.tip svg { flex-shrink: 0; }

.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tab { height: 76px; border: 0; border-radius: 24px; background: var(--surface); color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 800; font-size: 15px; }
.tab[aria-pressed="true"] { background: var(--kid); color: var(--on-solid); }
.items { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; border-radius: 32px; background: var(--surface); padding: 16px; }
.item { position: relative; border: 0; padding: 0 0 8px; border-radius: 22px; background: var(--soft); display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: inset 0 0 0 3px transparent; min-width: 0; }
.item svg.thumb { width: 100%; aspect-ratio: 1; height: auto; max-width: 100%; display: block; }
.item .nm { font-size: 14px; font-weight: 800; color: var(--muted); padding: 0 4px; text-align: center; line-height: 1.15; min-height: 1.15em; }
.item[aria-pressed="true"] { background: var(--kid-tint); box-shadow: inset 0 0 0 4px var(--kid); }
.item[aria-pressed="true"] .nm { color: var(--ink); }
.item.locked svg.thumb { opacity: .35; filter: grayscale(1); }
.item .lock { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; background: var(--surface); color: var(--muted); display: grid; place-items: center; }
.item .need { position: absolute; left: 10px; right: 10px; bottom: 34px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; color: var(--gold-ink); }
.item .need .meter { width: 100%; height: 8px; }
.item .new { position: absolute; top: 8px; left: 8px; padding: 2px 10px; border-radius: 12px; background: var(--gold); color: #3A2A00; font-size: 12px; font-weight: 800; }
.swatches { display: flex; flex-wrap: wrap; gap: 12px; padding: 14px 16px; border-radius: 32px; background: var(--surface); }
.sw { width: 56px; height: 56px; border-radius: 50%; border: 4px solid var(--surface); box-shadow: 0 0 0 2px var(--line); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--kid); }
.actions { display: flex; gap: 12px; margin-top: auto; }
.act { height: 72px; border: 0; border-radius: 36px; background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 24px; font-weight: 800; font-size: 20px; box-shadow: 0 5px 0 var(--shade); }
.act:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shade); }
.act.solid { flex-grow: 1; background: var(--kid); color: var(--on-solid); }
.act:disabled { opacity: .45; cursor: default; }

/* Feline: grotere vlakken, geen tekst */
.feline .tabs { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.feline .tab { height: 96px; border-radius: 30px; }
.feline .items { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.feline .item { padding-bottom: 0; border-radius: 28px; }
.feline .sw { width: 72px; height: 72px; }
.feline .act { height: 96px; min-width: 96px; border-radius: 48px; }

/* Nieuw stuk vrijgespeeld */
.feest { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-block: 24px 36px; text-align: center; }
.rays { position: relative; width: min(460px, 100%); aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; }
.rays::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(var(--gold-bg) 0 12deg, var(--bg) 12deg 24deg); }
.rays .fig { position: relative; width: 62%; height: auto; }
.burst { position: absolute; width: 44px; height: 44px; }
.feest h2 { margin: 0; font-size: clamp(44px, 6vw, 68px); line-height: 1; }
.feest p { margin: 0; font-size: 24px; font-weight: 700; color: var(--muted); max-width: 30ch; }
.feest .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
@media (prefers-reduced-motion: no-preference) {
  .burst { animation: pop 1.6s ease-in-out infinite alternate; }
  .rays::before { animation: spin 40s linear infinite; }
}
@keyframes pop { from { transform: scale(.8) rotate(-8deg); } to { transform: scale(1.1) rotate(8deg); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* Wie speelt er */
.who { display: flex; flex-direction: column; align-items: center; gap: 36px; padding-block: 40px; text-align: center; }
.who h2 { margin: 0; font-size: clamp(40px, 6vw, 64px); line-height: 1; }
.choices { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(16px, 3vw, 40px); }
.kid-btn { width: clamp(160px, 24vw, 250px); border: 0; border-radius: 36px; background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 14px 22px; box-shadow: 0 6px 0 var(--shade); }
.kid-btn .face { width: 100%; aspect-ratio: 1; border-radius: 28px; overflow: hidden; display: block; }
.kid-btn .face svg { width: 100%; height: 100%; display: block; }
.kid-btn span:last-child { font-size: clamp(26px, 3.4vw, 36px); }
.lockbtn { width: 56px; height: 56px; border: 0; border-radius: 50%; background: var(--surface); color: var(--muted); display: grid; place-items: center; }

/* Startscherm (uitsnede) */
.hero { position: relative; border-radius: 40px; padding: 22px 24px; display: flex; align-items: center; gap: 18px; overflow: hidden; margin-top: 20px; }
.hero.dark { background: var(--banner); color: var(--banner-ink); }
.hero.light { background: var(--surface); }
.me { position: relative; width: 120px; height: 120px; border: 0; padding: 0; border-radius: 50%; background: var(--kid-tint); overflow: hidden; flex-shrink: 0; box-shadow: 0 0 0 5px var(--gold); }
.me svg { width: 100%; height: 100%; display: block; }
.me .pen { position: absolute; right: 4px; bottom: 4px; width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: #3A2A00; display: grid; place-items: center; }
.hero h2 { margin: 0; font-size: clamp(30px, 4vw, 42px); line-height: 1.05; }
.hero .sub { font-size: 18px; font-weight: 700; opacity: .8; }
.hero .pillstar { margin-left: auto; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 20px 0 14px; border-radius: 28px; background: var(--surface); color: var(--ink); font-weight: 800; }
.hero .pillstar b { font-family: var(--font-display); font-size: 26px; }
.callout { margin: 16px 0 0 34px; display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 20px; border: 2px dashed var(--proto); color: var(--proto); font-weight: 800; font-size: 16px; }
.ghost { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 20px; padding-bottom: 28px; }
.ghost div { height: 200px; border-radius: 32px; background: var(--surface); opacity: .55; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--muted); }

/* Ouder (gsm) */
.phone { width: min(390px, 100%); margin: 24px auto 32px; border-radius: 36px; background: var(--bg); box-shadow: 0 0 0 10px var(--surface), 0 0 0 12px var(--line); padding: 20px 16px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
.phone .top { display: flex; align-items: center; gap: 12px; }
.phone .top .round { width: 48px; height: 48px; }
.phone h2 { margin: 0; font-size: 28px; flex-grow: 1; }
.phone .mini { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; background: var(--kid-tint); }
.pcard { border-radius: 20px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.pcard h3 { margin: 0; font-size: 18px; }
.pcard p { margin: 0; color: var(--muted); font-size: 15px; font-weight: 600; line-height: 1.4; }
.prow { display: flex; align-items: center; gap: 14px; }
.prow .pv { width: 96px; height: 120px; border-radius: 16px; background: var(--kid-tint); flex-shrink: 0; }
.prow .pv svg { width: 100%; height: 100%; }
.ptxt { display: flex; flex-direction: column; gap: 4px; font-size: 15px; font-weight: 700; min-width: 0; }
.ptxt span { color: var(--muted); font-weight: 600; }
.outline { height: 48px; border: 2px solid var(--line); border-radius: 24px; background: transparent; font-weight: 800; font-size: 16px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 800; }
.tog { width: 56px; height: 32px; border: 0; border-radius: 16px; background: var(--line); position: relative; flex-shrink: 0; }
.tog::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.tog[aria-checked="true"] { background: var(--ok); }
.tog[aria-checked="true"]::after { left: 28px; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; }
.steps span { padding: 4px 10px; border-radius: 12px; background: var(--soft); font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.steps span.done { background: var(--gold-bg); color: var(--gold-ink); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 14px 24px; border-radius: 28px; background: var(--ok); color: var(--on-solid); font-weight: 800; font-size: 20px; }

@media (max-width: 860px) {
  .kast { grid-template-columns: minmax(0, 1fr); }
  .stage { min-height: 420px; }
  .stage .fig { width: min(70%, 280px); }
  .items { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .feline .tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ghost { grid-template-columns: minmax(0, 1fr); }
  .hero { flex-wrap: wrap; }
  .hero .pillstar { margin-left: 0; }
}
@media (max-width: 480px) {
  .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .items, .feline .items { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .actions { flex-wrap: wrap; }
  .goal .txt { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .fig.hop { animation: none; }
}
</style>
</head>

<div class="proto" aria-label="Instellingen van het prototype">
  <div class="wrap">

  </div>
</div>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>

    const items = itemsOf(c).map((it) => {
      const lk = locked(it), n = need(it);
      const nw = S.mode === 'C' && kid().nieuw[0] === c.id && kid().nieuw[1] === it.id && S.nieuwGezien[S.kid];
      return `<button class="item${lk ? ' locked' : ''}" type="button" data-item="${it.id}" aria-pressed="${cfg[c.id] === it.id}" aria-label="${it.naam}${lk ? ', op slot' : ''}">
        ${figure({ ...cfg, [c.id]: it.id }, { vb: c.vb, cls: 'thumb', label: it.naam })}
        ${lk ? `<span class="lock">${ic(LOCK, 20)}</span>${f ? '' : `<span class="need">nog ${n - kid().verdiend} ★<span class="meter"><i style="width:${Math.round(kid().verdiend / n * 100)}%"></i></span></span>`}` : ''}
        ${nw ? '<span class="new">Nieuw</span>' : ''}
        ${f ? '' : `<span class="nm">${it.naam}</span>`}
      </button>`;
    }).join('');
    const sw = c.kleur ? `<div class="swatches" role="group" aria-label="Kleur">${Object.entries(c.pal).map(([k, v]) => `<button class="sw" type="button" data-kleur="${k}" style="background:${v}" aria-pressed="${cfg[c.kleur] === k}" aria-label="${k}"></button>`).join('')}</div>` : '';
    app.innerHTML = `<div class="wrap ${f ? 'feline' : ''}">
      <div class="bar">
        <button class="round" type="button" data-go="start" aria-label="Terug">${ic('M15 18l-6-6l6-6', 30)}</button>
        ${f ? `<button class="round" type="button" data-say="Kies je kleren" aria-label="Voorlezen">${ic(SPEAK, 28)}</button><h1></h1>` : '<h1 class="display">Mijn figuurtje</h1>'}
        ${goalPill()}
      </div>
      <div class="kast">
        <section class="stage" aria-label="Je figuurtje">
          ${S.tip ? `<div class="tip">${ic(LOCK, 28)}<span>${S.tip}</span></div>` : ''}
          ${figure(show, { cls: 'fig', id: 'big', label: 'Figuurtje van ' + kid().naam })}
        </section>
        <section class="panel">
          <div class="tabs">${tabs}</div>
          <div class="items">${items}</div>
          ${sw}
          <div class="actions">
            <button class="act" type="button" data-act="undo" aria-label="Ongedaan maken" ${S.hist[S.kid].length ? '' : 'disabled'}>${ic('M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3', 28)}${f ? '' : '<span>Terug</span>'}</button>
            <button class="act" type="button" data-act="dice" aria-label="Verrassing">${ic('M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM8.5 8.5h.01M15.5 15.5h.01M12 12h.01M15.5 8.5h.01M8.5 15.5h.01', 28)}${f ? '' : '<span>Verrassing</span>'}</button>
            <button class="act solid" type="button" data-act="klaar" aria-label="Klaar">${ic('M5 12l5 5l9-10', 32)}${f ? '' : '<span>Klaar</span>'}</button>
          </div>
        </section>
      </div>
    </div>`;
  }

  function change(patch) {
    S.hist[S.kid].push({ ...S.cfg[S.kid] });
    Object.assign(S.cfg[S.kid], patch);
    S.preview = null; S.tip = '';
    render(); hop();
  }
  function hop() {
    const b = document.getElementById('big');
    if (b) { b.classList.remove('hop'); void b.getBoundingClientRect(); b.classList.add('hop'); }
  }
  function pickItem(id) {
    const c = CAT[S.cat], it = c.items.find((x) => x.id === id);
    if (isF()) speak(it.naam);
    if (locked(it)) {
      clearTimeout(S.tipTimer);
      const rest = need(it) - kid().verdiend;
      S.preview = { ...S.cfg[S.kid], [c.id]: id };
      S.tip = isF() ? 'Nog even sterren sparen!' : `Nog ${rest} sterren verdienen, dan is ${it.naam.toLowerCase()} van jou.`;
      if (isF()) speak('Nog even sterren sparen');
      render(); hop();
      S.tipTimer = setTimeout(() => { S.preview = null; S.tip = ''; if (S.view === 'kast') render(); }, 2600);
      return;
    }
    change({ [c.id]: id });
  }
  function dice() {
    const pick = (xs) => xs[Math.floor(Math.random() * xs.length)];
    const patch = {};
    cats().forEach((c) => {
      patch[c.id] = pick(itemsOf(c).filter((it) => !locked(it))).id;
      if (c.kleur) patch[c.kleur] = pick(Object.keys(c.pal));
    });
    if (isF()) speak('Verrassing!');
    change(patch);
  }

  function viewNieuw() {
    const [cid, iid] = kid().nieuw, c = CAT[cid], it = c.items.find((x) => x.id === iid), f = isF();
    const cfg = { ...S.cfg[S.kid], [cid]: iid };
    const n = S.mode === 'A' ? 0 : need(it);
    // In het prototype: doen alsof de ouder net de sterren goedkeurde die deze mijlpaal halen
    kid().verdiend = Math.max(kid().verdiend, n);
    const bursts = [[6, 14], [82, 8], [2, 70], [86, 66], [44, -2]].map(([x, y], i) => `<span class="burst" style="left:${x}%;top:${y}%;animation-delay:${i * .25}s">${star(44)}</span>`).join('');
    app.innerHTML = `<div class="wrap"><div class="feest">
      <div class="rays">${bursts}${figure(cfg, { cls: 'fig', label: kid().naam + ' met ' + it.naam })}</div>
      ${f ? `<div class="starrow">${[0, 1, 2, 3, 4].map(() => star(44)).join('')}</div>` : `<h2 class="display">Nieuw!</h2><p>Je hebt ${n || ''} sterren verdiend en ${it.naam.toLowerCase()} vrijgespeeld.</p>`}
      <div class="row">
        <button class="act" type="button" data-go="kast" aria-label="Later">${ic('M15 18l-6-6l6-6', 28)}${f ? '' : '<span>Later</span>'}</button>
        <button class="act solid" type="button" data-act="aandoen" aria-label="Aandoen">${ic('M5 12l5 5l9-10', 32)}${f ? '' : '<span>Aandoen</span>'}</button>
      </div>
    </div></div>`;
    if (f) speak('Nieuw! Kijk eens wat je hebt gekregen.');
  }

  function viewWie() {
    app.innerHTML = `<div class="wrap"><div class="who">
      <h2 class="display">Wie speelt er?</h2>
      <div class="choices">${Object.entries(KIDS).map(([id, k]) => `
        <button class="kid-btn" type="button" data-kid="${id}" style="--kid-tint:var(--${id}-tint)">
          <span class="face">${figure(S.cfg[id], { vb: '20 -14 160 200', bg: 'var(--kid-tint)', label: k.naam })}</span>
          <span class="display">${k.naam}</span>
        </button>`).join('')}
      </div>
      <button class="lockbtn" type="button" data-go="ouder" aria-label="Ouders">${ic(LOCK, 24)}</button>
    </div></div>`;
  }

  function viewStart() {
    const k = kid(), dark = S.kid === 'luca', f = isF();
    app.innerHTML = `<div class="wrap">
      <div class="hero ${dark ? 'dark' : 'light'}">
        <button class="me" type="button" data-go="kast" aria-label="Mijn figuurtje aankleden">
          ${figure(S.cfg[S.kid], { vb: '24 -14 152 170', label: 'Mijn figuurtje' })}
          <span class="pen">${ic('M4 20h4L19 9l-4-4L4 16zM13 7l4 4', 20)}</span>
        </button>
        <div><h2 class="display">Hoi ${k.naam}!</h2>${f ? '' : `<div class="sub">${dark ? 'Nog 8 taken tot de finish' : 'Nog 5 taken vandaag'}</div>`}</div>
        <div class="pillstar">${star(28)}<b>40</b>${f ? '' : '<span>sterren</span>'}</div>
      </div>
      <div class="callout">${ic('M12 19V5M5 12l7-7l7 7', 22)}Het figuurtje vervangt de letter. Tik erop om de kleerkast te openen.</div>
      <div class="ghost"><div>Taken</div><div>Taken</div><div>Spelen en leren</div></div>
    </div>`;
  }

  function viewOuder() {
    const k = kid(), g = nextGoal(), on = S.mode === 'C';
    app.innerHTML = `<div class="wrap"><div class="phone">
      <div class="top">
        <button class="round" type="button" data-go="wie" aria-label="Terug">${ic('M15 18l-6-6l6-6', 24)}</button>
        <h2 class="display">${k.naam}</h2>
        <div class="mini">${figure(S.cfg[S.kid], { vb: '40 10 120 110', label: k.naam })}</div>
      </div>
      <div class="pcard">
        <h3>Figuurtje</h3>
        <div class="prow">
          <div class="pv">${figure(S.cfg[S.kid], { label: k.naam })}</div>
          <div class="ptxt">${on ? `${g.vrij} van ${g.totaal} stukken vrij<span>${k.verdiend} sterren verdiend in totaal${g.next ? `. Volgende: ${g.next.it.naam.toLowerCase()} bij ${g.next.n}.` : '.'}</span>` : `Alle ${g.totaal} stukken vrij<span>Vrijspelen staat uit.</span>`}</div>
        </div>
        <button class="outline" type="button" data-act="reset">Terugzetten naar basisfiguurtje</button>
      </div>
      <div class="pcard">
        <div class="switch"><span>Stukken vrijspelen met sterren</span><button class="tog" type="button" role="switch" aria-checked="${on}" data-act="toggle" aria-label="Stukken vrijspelen met sterren"></button></div>
        <p>Nieuwe stukken gaan open als ${k.naam} genoeg sterren verdiend heeft. Het saldo blijft hetzelfde: vrijspelen kost geen minuten.</p>
        ${on ? `<div class="steps">${g.drempels.map((n) => `<span class="${n <= k.verdiend ? 'done' : ''}">${n} ★</span>`).join('')}</div>` : ''}
      </div>
    </div></div>`;
  }

  const BASIS = { huid: 'licht', gezicht: 'lach', haar: 'kort', haarKleur: 'bruin', hoofd: 'geen', shirt: 'tshirt', broek: 'lang', broekKleur: 'jeans', schoenen: 'sport', schoenKleur: 'wit', extra: 'geen' };
  const THEMAKLEUR = { luca: 'blauw', yuna: 'oranje', feline: 'groen' };

  app.addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t) return;
    const d = t.dataset;
    if (d.cat) { S.cat = d.cat; S.preview = null; S.tip = ''; if (isF()) speak(CAT[d.cat].naam); render(); }
    else if (d.item) pickItem(d.item);
    else if (d.kleur) { if (isF()) speak(d.kleur); change({ [CAT[S.cat].kleur]: d.kleur }); }
    else if (d.say) speak(d.say);
    else if (d.kid) { S.kid = d.kid; S.view = 'start'; render(); }
    else if (d.go) { S.view = d.go; S.preview = null; S.tip = ''; render(); window.scrollTo(0, 0); }
    else if (d.act === 'undo') { const h = S.hist[S.kid].pop(); if (h) { S.cfg[S.kid] = h; render(); hop(); } }
    else if (d.act === 'dice') dice();
    else if (d.act === 'klaar') { S.hist[S.kid] = []; S.view = 'start'; render(); toast(isF() ? '✓' : 'Bewaard!'); if (isF()) speak('Mooi!'); }
    else if (d.act === 'aandoen') { const [cid, iid] = kid().nieuw; S.nieuwGezien[S.kid] = true; S.cat = cid; S.view = 'kast'; change({ [cid]: iid }); }
    else if (d.act === 'reset') { S.cfg[S.kid] = { ...BASIS, shirtKleur: THEMAKLEUR[S.kid] }; S.hist[S.kid] = []; render(); toast('Teruggezet'); }
    else if (d.act === 'toggle') { S.mode = S.mode === 'C' ? 'A' : 'C'; render(); }
  });

  render();
})();
</script>
</body>
</html>
