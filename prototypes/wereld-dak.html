<!doctype html>
<html lang="nl"><meta charset="utf-8"><title>Wereld: huis met zijgevel en dak</title>
<style>
body{margin:0;background:#7CC46A;font-family:Nunito,system-ui,sans-serif}
.vak{position:relative;height:600px;overflow:hidden}
.t{position:absolute;left:14px;top:12px;background:#FFF6DC;border:3px solid #8A5A33;border-radius:14px;padding:6px 14px;font-weight:800;color:#3B2A00;font-size:20px;z-index:2}
svg{width:100%;height:100%}
</style>
<body><div class="vak"><div class="t">Voorstel: voorgevel + zijgevel + dak (schuin van rechtsboven)</div><svg viewBox="0 0 1200 600" id="s"></svg></div>
<script>
const R=(i,k)=>{const n=Math.sin(i*127.1+k*311.7)*43758.5453;return n-Math.floor(n)}
let h='<rect width="1200" height="600" fill="#7CC46A"/>'
for(let i=0;i<60;i++)h+=`<ellipse cx="${R(i,1)*1200}" cy="${R(i,2)*600}" rx="50" ry="16" fill="#6AB55A" opacity=".5"/>`
h+='<rect x="-10" y="470" width="1220" height="100" rx="24" fill="#CDBF9F"/><rect x="-6" y="474" width="1212" height="92" rx="22" fill="#E2D9C6"/>'
for(let i=0;i<520;i++)h+=`<circle cx="${R(i,3)*1200}" cy="${474+R(i,4)*90}" r="${1.2+i%3*.6}" fill="${i%3?'#F1EBDD':'#B9AA88'}"/>`
const boom=(x,y,k)=>`<ellipse cx="${x+14}" cy="${y+3}" rx="44" ry="13" fill="#000" opacity=".15"/><rect x="${x-9}" y="${y-70}" width="18" height="70" rx="6" fill="#7A4A2A"/><circle cx="${x}" cy="${y-104}" r="64" fill="#2E8A3E"/><circle cx="${x-36}" cy="${y-90}" r="40" fill="#3FA04C"/><circle cx="${x+38}" cy="${y-88}" r="38" fill="#2A7E39"/><circle cx="${x-8}" cy="${y-132}" r="38" fill="#4DB65A"/>`+[[-44,-112],[-12,-150],[30,-128],[52,-96],[-60,-86],[8,-100]].map(([a,b])=>`<circle cx="${x+a}" cy="${y+b}" r="7" fill="${k}"/><circle cx="${x+a-2}" cy="${y+b-2}" r="2.2" fill="#fff" opacity=".6"/>`).join('')
// Een huis in schuin bovenaanzicht: voorgevel, zijgevel rechts (diepte gaat naar rechtsboven) en een zadeldak.
// x,y = linkeronderhoek van de voorgevel op de grond. W breed, H muur, D diepte (in beeld: dx,dy), P nokhoogte.
function huis(x,y,{W=190,H=104,P=62,dx=92,dy=-52,muur='#F2D9A8',zij='#D9BE88',dak='#D8452B',dakD='#A93A27',deur='#E46AA8'}={}){
  const R_=x+W, T=y-H, A=[x+W/2,T-P]
  const wand=(u,v)=>`${R_+u*dx} ${y+u*dy-v}` // punt op de zijgevel: u 0..1 diepte, v hoogte
  let s=''
  // schaduw op de grond (valt naar rechts)
  s+=`<polygon points="${x} ${y} ${R_} ${y} ${R_+dx+40} ${y+dy+8} ${x+dx+40} ${y+dy+8}" fill="#000" opacity=".16"/>`
  // zijgevel
  s+=`<polygon points="${wand(0,0)} ${wand(1,0)} ${wand(1,H)} ${wand(0,H)}" fill="${zij}"/>`
  // ramen in de zijgevel (geschoren)
  for(const u0 of [0.18,0.58]){const u1=u0+.24;s+=`<polygon points="${wand(u0,28)} ${wand(u1,28)} ${wand(u1,82)} ${wand(u0,82)}" fill="#fff"/><polygon points="${wand(u0+.02,32)} ${wand(u1-.02,32)} ${wand(u1-.02,78)} ${wand(u0+.02,78)}" fill="#9CCBEA"/>`}
  // dakvlak rechts (zichtbaar) van de nok naar de dakrand, met diepte
  s+=`<polygon points="${A[0]} ${A[1]} ${A[0]+dx} ${A[1]+dy} ${R_+dx+10} ${T+dy+6} ${R_+10} ${T+6}" fill="${dak}"/>`
  for(let i=1;i<6;i++){const t=i/6;s+=`<path d="M${A[0]+(R_+10-A[0])*t} ${A[1]+(T+6-A[1])*t}l${dx} ${dy}" stroke="${dakD}" stroke-width="2" opacity=".7"/>`}
  s+=`<polygon points="${A[0]} ${A[1]} ${A[0]+dx} ${A[1]+dy} ${R_+dx+10} ${T+dy+6} ${R_+10} ${T+6}" fill="none" stroke="${dakD}" stroke-width="3" stroke-linejoin="round"/>`
  // schoorsteen (op het achterste deel)
  const cx=A[0]+dx*0.55+26,cy=A[1]+dy*0.55+22
  s+=`<polygon points="${cx} ${cy} ${cx+34} ${cy} ${cx+34} ${cy-44} ${cx} ${cy-44}" fill="#9A5B3A"/><polygon points="${cx+34} ${cy} ${cx+48} ${cy-8} ${cx+48} ${cy-52} ${cx+34} ${cy-44}" fill="#7A4326"/><polygon points="${cx} ${cy-44} ${cx+34} ${cy-44} ${cx+48} ${cy-52} ${cx+14} ${cy-52}" fill="#B7714A"/>`
  // voorgevel met gevelspits
  s+=`<polygon points="${x} ${y} ${R_} ${y} ${R_} ${T} ${A[0]} ${A[1]} ${x} ${T}" fill="${muur}"/>`
  s+=`<polygon points="${x-12} ${T+6} ${A[0]} ${A[1]-6} ${R_+10} ${T+6} ${R_+10} ${T+16} ${A[0]} ${A[1]+4} ${x-12} ${T+16}" fill="${dak}" stroke="${dakD}" stroke-width="3" stroke-linejoin="round"/>`
  s+=`<rect x="${x}" y="${y-6}" width="${W}" height="6" fill="#000" opacity=".12"/>`
  // ramen en deur
  const raam=(rx)=>`<rect x="${rx}" y="${T+34}" width="44" height="44" rx="4" fill="#fff"/><rect x="${rx+5}" y="${T+39}" width="34" height="34" fill="#9CCBEA"/><path d="M${rx+22} ${T+39}v34M${rx+5} ${T+56}h34" stroke="#fff" stroke-width="3"/>`
  s+=raam(x+16)+raam(R_-60)
  s+=`<rect x="${x+W/2-22}" y="${y-72}" width="44" height="72" rx="6" fill="${deur}"/><rect x="${x+W/2-14}" y="${y-64}" width="28" height="24" rx="3" fill="#BFE3FA"/><circle cx="${x+W/2+12}" cy="${y-30}" r="3" fill="#F2C230"/>`
  s+=`<rect x="${x+W/2-30}" y="${y-4}" width="60" height="8" rx="3" fill="#C8CED6"/>`
  // kleine ronde dakraam op de gevelspits
  s+=`<circle cx="${A[0]}" cy="${T-22}" r="10" fill="#fff"/><circle cx="${A[0]}" cy="${T-22}" r="6" fill="#9CCBEA"/>`
  return s
}
h+=boom(70,420,'#D93A3A')
h+=huis(190,430,{})
h+=boom(520,425,'#F2994A')
h+=huis(640,436,{muur:'#CFE3F7',zij:'#A9C6E4',dak:'#3E6FB5',dakD:'#27508C',deur:'#F2C230',W:170,H:96,P:56,dx:84,dy:-48})
h+=boom(1130,430,'#D93A3A')
h+=`<ellipse cx="420" cy="540" rx="17" ry="6" fill="#000" opacity=".18"/><rect x="407" y="508" width="26" height="30" rx="5" fill="#2D6BD6"/><circle cx="420" cy="494" r="15" fill="#F5D2B3"/><path d="M405 492q15-22 30 0q-15-8-30 0z" fill="#6B3E1F"/><circle cx="415" cy="496" r="2" fill="#1C2433"/><circle cx="425" cy="496" r="2" fill="#1C2433"/>`
s.innerHTML=h
</script></html>
