<!doctype html>
<html lang="nl"><meta charset="utf-8"><title>Wereld: huis met dakzicht</title>
<style>
body{margin:0;background:#7CC46A;font-family:Nunito,system-ui,sans-serif}
.rij{display:flex;gap:0}
.vak{flex:1;position:relative;height:560px;overflow:hidden;background:#7CC46A}
.vak+.vak{border-left:4px solid #fff}
.t{position:absolute;left:14px;top:12px;background:#FFF6DC;border:3px solid #8A5A33;border-radius:14px;padding:6px 14px;font-weight:800;color:#3B2A00;font-size:20px;z-index:2}
svg{width:100%;height:100%}
</style>
<body><div class="rij">
<div class="vak"><div class="t">Nu: voorgevel</div><svg viewBox="0 0 600 560" id="a"></svg></div>
<div class="vak"><div class="t">Voorstel: dak van boven</div><svg viewBox="0 0 600 560" id="b"></svg></div>
</div>
<script>
const gras=(s)=>{let h='<rect width="600" height="560" fill="#7CC46A"/>';for(let i=0;i<40;i++){const x=(Math.sin(i*12.9)*43758%1+1)%1*600,y=(Math.sin(i*78.2)*12345%1+1)%1*560;h+=`<ellipse cx="${x}" cy="${y}" rx="40" ry="14" fill="#6AB55A" opacity=".5"/>`}
 h+='<rect x="-10" y="400" width="620" height="90" rx="22" fill="#CDBF9F"/><rect x="-6" y="404" width="612" height="82" rx="20" fill="#E2D9C6"/>';
 for(let i=0;i<260;i++){const x=(Math.sin(i*31.7)*9999%1+1)%1*600,y=404+(Math.sin(i*5.3)*7777%1+1)%1*80;h+=`<circle cx="${x}" cy="${y}" r="${1.2+i%3*.6}" fill="${i%3?'#F1EBDD':'#B9AA88'}"/>`}
 return h}
const boom=(x,y,k)=>`<ellipse cx="${x+10}" cy="${y+3}" rx="42" ry="13" fill="#000" opacity=".14"/><rect x="${x-9}" y="${y-70}" width="18" height="70" rx="6" fill="#7A4A2A"/><circle cx="${x}" cy="${y-104}" r="64" fill="#2E8A3E"/><circle cx="${x-36}" cy="${y-90}" r="40" fill="#3FA04C"/><circle cx="${x+38}" cy="${y-88}" r="38" fill="#2A7E39"/><circle cx="${x-8}" cy="${y-132}" r="38" fill="#4DB65A"/>`+[[-44,-112],[-12,-150],[30,-128],[52,-96],[-60,-86],[8,-100]].map(([a,b])=>`<circle cx="${x+a}" cy="${y+b}" r="7" fill="${k}"/><circle cx="${x+a-2}" cy="${y+b-2}" r="2.2" fill="#fff" opacity=".6"/>`).join('')
// voorgevel (zoals nu)
const huisA=()=>`<ellipse cx="300" cy="402" rx="150" ry="12" fill="#000" opacity=".14"/><rect x="170" y="250" width="260" height="150" fill="#F2D9A8"/><path d="M140 252L300 120L460 252Z" fill="#C8452F"/><rect x="380" y="130" width="26" height="50" fill="#8A5A33"/>
<rect x="196" y="290" width="62" height="62" rx="4" fill="#fff"/><rect x="202" y="296" width="50" height="50" fill="#BFE3FA"/><rect x="342" y="290" width="62" height="62" rx="4" fill="#fff"/><rect x="348" y="296" width="50" height="50" fill="#BFE3FA"/>
<rect x="272" y="300" width="56" height="100" rx="6" fill="#E46AA8"/><rect x="282" y="310" width="36" height="30" rx="3" fill="#BFE3FA"/>`
// dak van boven: grote dakvlakken met nok, voorgevel eronder, dakrand en schaduw op het gras
const huisB=()=>`<ellipse cx="318" cy="414" rx="170" ry="16" fill="#000" opacity=".16"/>
<rect x="176" y="292" width="248" height="108" fill="#F2D9A8"/><rect x="176" y="292" width="248" height="10" fill="#000" opacity=".12"/>
<rect x="196" y="318" width="58" height="56" rx="4" fill="#fff"/><rect x="202" y="324" width="46" height="44" fill="#BFE3FA"/><path d="M225 324v44M202 346h46" stroke="#fff" stroke-width="3"/>
<rect x="346" y="318" width="58" height="56" rx="4" fill="#fff"/><rect x="352" y="324" width="46" height="44" fill="#BFE3FA"/><path d="M375 324v44M352 346h46" stroke="#fff" stroke-width="3"/>
<rect x="272" y="330" width="56" height="70" rx="6" fill="#E46AA8"/><rect x="282" y="338" width="36" height="26" rx="3" fill="#BFE3FA"/><rect x="262" y="398" width="76" height="8" rx="3" fill="#C8CED6"/>
<path d="M150 296L204 126H396L450 296Z" fill="#D8452B"/><path d="M204 126H396L450 296H150Z" fill="none" stroke="#A93A27" stroke-width="5" stroke-linejoin="round"/>
<path d="M204 126L150 296M396 126L450 296" stroke="#A93A27" stroke-width="3"/>
<path d="M150 296H450" stroke="#A93A27" stroke-width="8" stroke-linecap="round"/><path d="M158 300H442" stroke="#000" stroke-width="10" opacity=".14" stroke-linecap="round"/>
<g stroke="#B93C26" stroke-width="2.5" opacity=".9">${[150,174,198,222,246,270].map(y=>`<path d="M${204-(y-126)*0.32} ${y}H${396+(y-126)*0.32}"/>`).join('')}</g>
<path d="M204 126H396L402 140H198Z" fill="#E8604A"/><rect x="368" y="150" width="34" height="40" rx="3" fill="#8A5A33"/><rect x="364" y="144" width="42" height="10" rx="3" fill="#A87040"/><rect x="372" y="154" width="26" height="32" fill="#5A3820" opacity=".5"/>`
const fig=`<ellipse cx="300" cy="470" rx="17" ry="6" fill="#000" opacity=".18"/><rect x="287" y="440" width="26" height="28" rx="5" fill="#2D6BD6"/><circle cx="300" cy="426" r="15" fill="#F5D2B3"/><path d="M285 424q15-22 30 0q-15-8-30 0z" fill="#6B3E1F"/><circle cx="295" cy="428" r="2" fill="#1C2433"/><circle cx="305" cy="428" r="2" fill="#1C2433"/>`
a.innerHTML=gras()+boom(100,330,'#D93A3A')+boom(520,340,'#F2994A')+huisA()+fig
b.innerHTML=gras()+boom(90,330,'#D93A3A')+boom(528,340,'#F2994A')+huisB()+fig
</script></html>
