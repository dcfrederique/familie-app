name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Eén deploy tegelijk per branch of PR; een nieuwere commit wacht tot de vorige klaar is.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  bouwen-en-testen:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-db.sh
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres

  # Naar Azure Static Web Apps, pas als alle tests groen zijn (docs/hosting.md).
  # Push op main = de echte app; een PR krijgt een eigen voorbeeld-adres.
  # Zonder het secret AZURE_STATIC_WEB_APPS_API_TOKEN slaat deze job zich over.
  deployen:
    needs: [bouwen-en-testen, database]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # de action zet het voorbeeld-adres als reactie in de PR
    environment:
      name: ${{ github.event_name == 'push' && 'productie' || 'voorbeeld' }}
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    env:
      TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - if: env.TOKEN == ''
        run: echo "::notice::Secret AZURE_STATIC_WEB_APPS_API_TOKEN ontbreekt, niets te deployen (zie docs/hosting.md)."
      - if: env.TOKEN != ''
        uses: actions/checkout@v4
      - if: env.TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.TOKEN != ''
        run: npm ci
      # De VITE_-waarden zijn publiek (ze zitten in de app zelf), dus repository-variabelen, geen secrets.
      - if: env.TOKEN != ''
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - if: env.TOKEN != ''
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true

  # Een gesloten of gemergde PR: het voorbeeld-adres weer opruimen (Free heeft er maar 3).
  voorbeeld-opruimen:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - if: env.TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.TOKEN }}
          action: close
          app_location: dist
