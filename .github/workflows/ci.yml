name: CI

on:
  push:
    branches: [main]
  # Na nieuwe opnames start stem.yml CI zo, want een push met GITHUB_TOKEN start geen workflows.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Eén deploy tegelijk per branch of PR; een nieuwere commit wacht tot de vorige klaar is.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  bouwen-en-testen:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Playwright-tests in de demo (e2e/): werking van de sterrenlus en of elk kinderscherm past op gangbare tablets.
  e2e:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --workers=4
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-uitslag
          path: test-results/
          retention-days: 7

  database:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - run: scripts/test-db.sh
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
      # Het migratiescript op de testdatabase: alles staat er al, dus het mag niets opnieuw draaien.
      - run: scripts/migraties.sh | tee uit.txt && grep -q 'Klaar. 0 nieuwe' uit.txt
        env:
          SUPABASE_DB_URL: postgres://postgres@localhost:5432/familie_test

  # Nieuwe migraties op de echte Supabase-database, alleen voor main en pas als alle tests groen zijn.
  # Zonder het secret SUPABASE_DB_URL (session pooler, docs/hosting.md) slaat deze job zich over.
  migraties:
    needs: [bouwen-en-testen, database, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      OP_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - if: env.OP_MAIN == 'true' && env.SUPABASE_DB_URL == ''
        run: echo "::notice::Secret SUPABASE_DB_URL ontbreekt, migraties niet uitgevoerd."
      - if: env.OP_MAIN == 'true' && env.SUPABASE_DB_URL != ''
        uses: actions/checkout@v5
      - if: env.OP_MAIN == 'true' && env.SUPABASE_DB_URL != ''
        run: scripts/migraties.sh

  # De Edge Function "melding" uitrollen en het adres + geheim voor de trigger zetten (docs/meldingen.md).
  # Alleen op main, na de migraties. Zonder SUPABASE_ACCESS_TOKEN of VAPID_PRIVATE_KEY slaat de job zich over.
  meldingen:
    needs: [migraties]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      KLAAR: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.SUPABASE_DB_URL != '' && secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.VAPID_PRIVATE_KEY != '' && vars.VITE_VAPID_PUBLIC_KEY != '' }}
    steps:
      - if: env.KLAAR != 'true'
        run: echo "::notice::Meldingen niet uitgerold (op main nodig; secrets SUPABASE_ACCESS_TOKEN, VAPID_PRIVATE_KEY en variabele VITE_VAPID_PUBLIC_KEY, zie docs/meldingen.md)."
      - if: env.KLAAR == 'true'
        uses: actions/checkout@v5
      # De private key moet bij de public key horen waarmee de app zich aanmeldt, anders weigert Google elke melding (403).
      - if: env.KLAAR == 'true'
        run: |
          node -e "
            const c = require('crypto').createECDH('prime256v1')
            c.setPrivateKey(Buffer.from(process.env.VAPID_PRIVATE_KEY.trim(), 'base64url'))
            const afgeleid = c.getPublicKey().toString('base64url')
            if (afgeleid !== process.env.VAPID_PUBLIC_KEY.trim()) {
              console.log('::error::VAPID_PRIVATE_KEY hoort niet bij VITE_VAPID_PUBLIC_KEY. Genereer een nieuw paar (npx web-push generate-vapid-keys) en zet beide opnieuw (docs/meldingen.md).')
              process.exit(1)
            }
            console.log('VAPID-sleutels horen bij elkaar.')"
      - if: env.KLAAR == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: env.KLAAR == 'true'
        run: |
          ref=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          # Adres van de functie in de database; het geheim maakt de database zelf aan en we geven het door aan de functie.
          echo "update public.melding_instellingen set functie_url = :'url'" \
            | psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -v url="$SUPABASE_URL/functions/v1/melding"
          geheim=$(psql "$SUPABASE_DB_URL" -X -tA -c "select geheim from public.melding_instellingen")
          echo "::add-mask::$geheim"
          supabase secrets set --project-ref "$ref" VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" MELDING_GEHEIM="$geheim"
          supabase functions deploy melding --project-ref "$ref" --no-verify-jwt

  # Android-schil (docs/capacitor.md): bouwt een debug-APK die de gehoste site opent. Op main komt hij ook als
  # download bij de release "android-latest". Mislukt dit, dan blokkeert het het deployen niet.
  android:
    needs: [bouwen-en-testen]
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # de release android-latest bijwerken (alleen op main)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk familie.apk
      - uses: actions/upload-artifact@v5
        with:
          name: familie-apk
          path: familie.apk
          retention-days: 30
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Android-app (laatste)" --notes "Debug-APK van de Familie-app (docs/capacitor.md)."
          gh release upload android-latest familie.apk --clobber

  # Naar Azure Static Web Apps, pas als alle tests groen zijn (docs/hosting.md).
  # Push op main = de echte app; een PR krijgt een eigen voorbeeld-adres.
  # Zonder het secret AZURE_STATIC_WEB_APPS_API_TOKEN slaat deze job zich over.
  deployen:
    needs: [bouwen-en-testen, database, migraties, e2e]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # de action zet het voorbeeld-adres als reactie in de PR
    environment:
      name: ${{ github.event_name != 'pull_request' && 'productie' || 'voorbeeld' }}
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    env:
      TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - if: env.TOKEN == ''
        run: echo "::notice::Secret AZURE_STATIC_WEB_APPS_API_TOKEN ontbreekt, niets te deployen (zie docs/hosting.md)."
      - if: env.TOKEN != ''
        uses: actions/checkout@v5
      - if: env.TOKEN != ''
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: env.TOKEN != ''
        run: npm ci
      # De VITE_-waarden zijn publiek (ze zitten in de app zelf), dus repository-variabelen, geen secrets.
      - if: env.TOKEN != ''
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - if: env.TOKEN != ''
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true

  # Een gesloten of gemergde PR: het voorbeeld-adres weer opruimen (Free heeft er maar 3).
  voorbeeld-opruimen:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - if: env.TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.TOKEN }}
          action: close
          app_location: dist
