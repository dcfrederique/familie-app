# Kijkt na waarom meldingen niet aankomen (docs/meldingen.md), zonder geheimen te tonen.
# Met de hand starten: Actions → Meldingen nakijken → Run workflow.
name: Meldingen nakijken

on:
  workflow_dispatch:

jobs:
  nakijken:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - name: Edge Function bereikbaar?
        run: |
          # Zonder geheim hoort de functie 401 te geven; 404 = niet gedeployed.
          curl -sS -o uit.txt -w 'melding: HTTP %{http_code}\n' -X POST "$SUPABASE_URL/functions/v1/melding" -d '{}' || true
          echo "antwoord: $(head -c 200 uit.txt)"
      - name: Database
        run: |
          q() { echo "== $1"; psql "$SUPABASE_DB_URL" -X -P pager=off -c "$2" || true; }
          q 'extensies' "select extname, extversion from pg_extension where extname in ('pg_net','pg_cron','supabase_vault')"
          q 'abonnementen (ouder-gsm''s)' "select gezin_id, count(*), max(aangemaakt) laatst from public.push_abonnementen group by 1"
          q 'triggers op de drie tabellen' "select c.relname tabel, t.tgname trigger, p.proname functie, t.tgenabled from pg_trigger t join pg_class c on c.oid = t.tgrelid join pg_proc p on p.oid = t.tgfoid where not t.tgisinternal and c.relname in ('inzendingen','tijdverzoeken','activiteitlog') order by 1"
          q 'laatste webhook-antwoorden' "select id, created, status_code, left(content, 400) inhoud, error_msg, timed_out from net._http_response order by created desc limit 15"
          q 'laatste inzendingen/activiteiten' "(select 'inzending' soort, tijdstip from public.inzendingen order by tijdstip desc limit 3) union all (select 'tijdverzoek', aangevraagd_op from public.tijdverzoeken order by aangevraagd_op desc limit 3)"
