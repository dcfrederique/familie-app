# Spreekt nieuwe of gewijzigde verhalen en vaste zinnen in met de Vlaamse stemmen (docs/voorleesstem.md).
# Draait vanzelf als een verhaal of zin wijzigt, of handmatig: Actions → Voorleesstem inspreken → Run workflow.
# Zet de opnames terug op main en start daarna CI, die de app opnieuw uitrolt.
# Zonder de secrets AZURE_SPEECH_KEY en AZURE_SPEECH_REGION slaat deze workflow zich over.
name: Voorleesstem inspreken

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/data/verhalen/**
      - src/data/zinnen.ts
      - src/data/huisdieren.ts
      - src/data/recepten.ts
      - src/lib/stem.ts
      - scripts/maak-stem.ts

concurrency:
  group: stem
  cancel-in-progress: false

jobs:
  inspreken:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # opnames terug op main zetten
      actions: write # CI starten na de commit (een push met GITHUB_TOKEN start zelf geen workflows)
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
    steps:
      - if: env.AZURE_SPEECH_KEY == '' || env.AZURE_SPEECH_REGION == ''
        run: echo "::notice::Secrets AZURE_SPEECH_KEY en AZURE_SPEECH_REGION ontbreken, niets in te spreken (zie docs/voorleesstem.md)."
      - if: env.AZURE_SPEECH_KEY != '' && env.AZURE_SPEECH_REGION != ''
        uses: actions/checkout@v5
        with:
          ref: main
      - if: env.AZURE_SPEECH_KEY != '' && env.AZURE_SPEECH_REGION != ''
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: env.AZURE_SPEECH_KEY != '' && env.AZURE_SPEECH_REGION != ''
        run: npm ci
      - if: env.AZURE_SPEECH_KEY != '' && env.AZURE_SPEECH_REGION != ''
        run: node scripts/maak-stem.ts
      - name: Opnames op main zetten en uitrollen
        if: always() && env.AZURE_SPEECH_KEY != '' && env.AZURE_SPEECH_REGION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A public/stem src/data/opnames.json
          if git diff --cached --quiet; then echo "Niets nieuws."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Voorleesstem: opnames bijgewerkt"
          for poging in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 10
          done
          gh workflow run ci.yml --ref main
